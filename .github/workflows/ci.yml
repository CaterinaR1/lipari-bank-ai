name: CI

on:
  push:
  pull_request:

jobs:
  segreti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  qualita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests evals scripts liparibank_mcp

  test:
    runs-on: ubuntu-latest
    needs: [qualita]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lipari
          POSTGRES_PASSWORD: lipari
          POSTGRES_DB: lipari_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lipari -d lipari_ai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lipari:lipari@localhost:5432/lipari_ai_test
      TEST_DATABASE_URL: postgresql+asyncpg://lipari:lipari@localhost:5432/lipari_ai_test
      JWT_SECRET: test-secret-jwt-key-at-least-32-characters-long
      OPENAI_API_KEY: sk-test-mai-valida
      ANTHROPIC_API_KEY: sk-ant-test-mai-valida
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Pytest
        run: uv run pytest -q --cov=src --cov-fail-under=80

  immagine:
    runs-on: ubuntu-latest
    needs: [segreti, qualita, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lipari-bank-ai:ci .
