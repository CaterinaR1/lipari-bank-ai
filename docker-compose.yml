services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lipari-postgres
    environment:
      POSTGRES_USER: lipari
      POSTGRES_PASSWORD: lipari
      POSTGRES_DB: lipari_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lipari -d lipari_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: